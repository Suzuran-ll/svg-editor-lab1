  <text id="other-title" x="30" y="45">Imported diagram</text>
  <ellipse id="halo" cx="320" cy="240" rx="150" ry="80" fill="#eef5ff"/>
  <g id="imported-group" stroke="#224466">
    <rect id="imported-rect" x="100" y="160" width="100" height="60" fill="#4a90d9"/>
    <circle id="imported-circle" cx="440" cy="190" r="30" fill="#f5a623"/>
  </g>
  <line id="connector" x1="200" y1="190" x2="410" y2="190" stroke="black"/>
</svg>
